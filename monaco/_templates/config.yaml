# GENERATED by the OaC submission handler from a dev-team form submission.
# Do not hand-edit — re-submit the form to change. One service = one folder.
#
# Service:  {{SERVICE_NAME}}
# Team:     {{OWNING_TEAM}}   Env: {{ENVIRONMENT}}   Tier: {{SERVICE_TIER}}
# Severity: {{SEVERITY}} ({{DT_SEVERITY}})   SLI: {{SLI_METRIC}} > {{THRESHOLD}}
#
# NOTE FOR CLAUDE CODE ON EC2: the JSON payload shapes below are scaffolds.
# Run `monaco download` against the live trial tenant to confirm the exact
# Settings 2.0 schema fields and the custom-service config-API type for this
# technology, then reconcile these templates. See CLAUDE.md > "Schema truth".
configs:
  - id: {{CONFIG_ID}}-auto-tag
    type:
      settings:
        schema: builtin:tags.auto-tagging
        scope: environment
    config:
      name: "LPL OaC tag - {{SERVICE_NAME}}"
      template: auto-tag.json
      skip: false

  - id: {{CONFIG_ID}}-custom-service
    type: custom-service-{{TECHNOLOGY}}
    config:
      name: "{{SERVICE_NAME}}"
      template: custom-service.json
      skip: false

  - id: {{CONFIG_ID}}-alerting-profile
    type:
      settings:
        schema: builtin:appsec.notification-alerting-profile
        scope: environment
    config:
      name: "LPL OaC profile - {{SERVICE_NAME}}"
      template: alerting-profile.json
      skip: false

  - id: {{CONFIG_ID}}-metric-event
    type:
      settings:
        schema: builtin:anomaly-detection.metric-events
        scope: environment
    config:
      name: "LPL OaC alert - {{SERVICE_NAME}}"
      template: metric-event.json
      skip: false
